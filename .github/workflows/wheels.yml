name: Wheel builder

on:
  push:
    branches: ['verify/master-win-arm64-wheels']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: ${{ matrix.os }}, ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup QEMU
        if: ${{ runner.os == 'Linux' }}
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: "cp3*-*"
          CIBW_ARCHS_WINDOWS: "AMD64 ARM64 x86"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_LINUX: "x86_64 i686 aarch64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: yum install -y libusb1-devel libudev-devel || apk add --upgrade libusb-dev eudev-dev

      - name: Store artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  test_win_arm64:
    # verification-only job: run the project's tests.py natively on Windows ARM64
    name: test win_arm64 cp${{ matrix.python }}
    needs: build_wheels
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          name: cibw-wheels-windows-latest-0
          path: wheelhouse
      - name: Install and test
        shell: pwsh
        run: |
          python -c "import platform, sys; print(sys.version); print(platform.machine())"
          $tag = python -c "import sys; print(f'cp{sys.version_info[0]}{sys.version_info[1]}')"
          $whl = Get-ChildItem wheelhouse -Filter "hidapi-*-$tag-$tag-win_arm64.whl" | Select-Object -First 1
          if (-not $whl) { Get-ChildItem wheelhouse; throw "no win_arm64 wheel for $tag" }
          Write-Host "Installing $($whl.Name)"
          python -m venv C:\t\venv
          C:\t\venv\Scripts\python -m pip install $whl.FullName
          Copy-Item tests.py C:\t\tests.py
          Push-Location C:\t
          C:\t\venv\Scripts\python -c "import hid, sys; print(hid.__file__); print(hid.version_str if hasattr(hid,'version_str') else '')"
          C:\t\venv\Scripts\python tests.py -v 2>&1 | Tee-Object -FilePath C:\t\tests-$tag.txt
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }
          Pop-Location
          Copy-Item C:\t\tests-$tag.txt .
      - uses: actions/upload-artifact@v5
        with:
          name: tests-win-arm64-${{ matrix.python }}
          path: tests-*.txt
